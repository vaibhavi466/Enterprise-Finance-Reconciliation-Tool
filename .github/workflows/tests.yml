name: Automated Reconciliation Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run unit tests
      run: |
        python -m unittest discover tests

    - name: Test sample data generation and end-to-end reconciliation
      run: |
        python generate_sample_data.py
        python reconciliation.py --erp sample_data/erp_data.csv --external sample_data/bank_data.xlsx --output output --key invoice_id --amount-tolerance 0.01
