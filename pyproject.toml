[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-finance-reconciliation-tool"
version = "1.0.0"
description = "Rule-driven Python finance reconciliation engine with duplicate isolation, Decimal-based matching, exception reporting, and auditable Excel outputs."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "python",
    "pandas",
    "finance",
    "reconciliation",
    "automation",
    "data-quality",
    "excel",
    "fintech",
    "data-engineering",
]
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
]

[project.scripts]
finance-reconcile = "reconciliation:main"

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
